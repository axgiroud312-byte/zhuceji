[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agnes-auto-provisioner"
version = "0.1.0"
description = "可恢复的 Agnes 开户任务与本地交付工具"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic[email]>=2.8,<3",
  "httpx[socks]>=0.27,<1",
]

[project.scripts]
agnes = "agnes_provisioner.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agnes_provisioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
